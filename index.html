<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Rifas Pro</title>
    <style>
        :root { --azul: #1E40AF; --oscuro: #172554; --verde-s: #DCFCE7; --verde-f: #047857; --beige: #F5F5DC; --borde: #D1D5DB; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--beige); color: #000; min-height: 100vh; display: flex; flex-direction: column; }
        nav { background-color: var(--azul); padding: 15px; border-bottom: 4px solid var(--oscuro); position: sticky; top: 0; z-index: 50; }
        .nav-container { max-width: 95%; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        @media (min-width: 1200px) { .nav-container { flex-direction: row; justify-content: space-between; align-items: center; } }
        .management-box { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background-color: rgba(23,37,84,0.4); padding: 12px; border-radius: 10px; border: 1px solid #60A5FA; }
        .nav-title { color: #FFF; font-weight: 900; font-size: 1.1rem; }
        select, .input-top { padding: 8px; font-size: 1rem; font-weight: 800; border-radius: 6px; border: 2px solid #FFF; min-width: 200px; }
        .btn-action { padding: 8px 14px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; color: #FFF; }
        .btn-create { background-color: #10B981; }
        .btn-delete { background-color: #EF4444; }
        .btn-delete:disabled { background-color: #FCA5A5; cursor: not-allowed; }
        .btn-backup-download { background-color: #059669; font-size: 0.85rem; }
        .btn-backup-upload { background-color: #4B5563; font-size: 0.85rem; }
        .sync-box { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; background: #111827; padding: 8px 15px; border-radius: 8px; color: #FFF; font-size: 0.85rem; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-green { background: #10B981; }
        .dot-amber { background: #F59E0B; }
        .tabs-container { display: flex; gap: 8px; justify-content: center; margin-top: 15px; }
        .menu-btn { padding: 10px 20px; font-size: 1rem; font-weight: 900; text-transform: uppercase; color: #FFF; background: rgba(255,255,255,0.2); border: none; border-radius: 8px; cursor: pointer; }
        .menu-btn.active { background-color: #FFF; color: var(--azul); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        main { flex-grow: 1; padding: 20px; max-width: 95%; width: 100%; margin: 0 auto; }
        .tab-panel { width: 100%; background-color: #FFF; border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        .panel-header { border-bottom: 4px solid var(--azul); padding-bottom: 12px; margin-bottom: 20px; }
        .panel-header h1 { font-size: 1.6rem; font-weight: 900; color: var(--azul); }
        .grid-form { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 850px; margin-bottom: 25px; }
        @media (min-width: 768px) { .grid-form { grid-template-columns: 1fr 1fr; } }
        .field-group { display: flex; flex-direction: column; gap: 6px; }
        .field-group label { font-size: 1rem; font-weight: 900; }
        .input-mediano { width: 100%; max-width: 360px; padding: 10px; font-size: 1rem; font-weight: 700; border: 3px solid var(--azul); border-radius: 10px; }
        .btn-submit-main { background-color: #059669; color: #FFF; font-weight: 900; font-size: 1.1rem; padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; align-self: flex-start; }
        .btn-submit-main:disabled { background-color: #A7F3D0; cursor: not-allowed; }
        .table-wrapper { overflow-x: auto; background-color: #FFF; border: 1px solid var(--borde); border-radius: 12px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: var(--verde-f); color: #FFF; padding: 12px; font-weight: 700; }
        td { padding: 12px; border-bottom: 1px solid var(--borde); font-weight: 600; }
        .grid-stats { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }
        @media (min-width: 640px) { .grid-stats { grid-template-columns: repeat(3, 1fr); } }
        .stat-card { background-color: #FFF; padding: 15px; border-radius: 12px; border: 2px solid var(--borde); text-align: center; }
        .stat-number { font-size: 2rem; font-weight: 900; margin-top: 8px; }
        .color-vendidos { color: var(--verde-f); }
        .color-apartados { color: #D97706; }
        .color-recaudado { color: var(--azul); }
        .msg-box { padding: 10px; font-size: 1.1rem; font-weight: 800; text-align: center; }
        .badge-v { background-color: var(--verde-s); color: var(--verde-f); padding: 4px 8px; border-radius: 6px; }
        .badge-a { background-color: #FEF3C7; color: #D97706; padding: 4px 8px; border-radius: 6px; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="management-box">
                <span class="nav-title">🎟️ GESTIÓN:</span>
                <select id="raffleSelect" onchange="loadSelectedRaffle()"></select>
                <input type="text" id="newRaffleNameInput" class="input-top" placeholder="Nueva rifa...">
                <button type="button" onclick="ejecutarCreacionDeRifa(event)" class="btn-action btn-create">➕ CREAR</button>
                <button id="deleteRaffleBtn" type="button" onclick="cleanUpRaffle(event)" class="btn-action btn-delete" disabled>❌ ELIMINAR</button>
            </div>
            <div class="sync-box">
                <div id="syncIndicatorDot" class="dot dot-green"></div>
                <span id="syncIndicatorText">Local Activo</span>
                <button type="button" onclick="downloadBackupFile()" class="btn-action btn-backup-download">💾 Descargar</button>
                <button type="button" onclick="document.getElementById('fileLoaderInput').click()" class="btn-action btn-backup-upload">📂 Abrir</button>
                <input type="file" id="fileLoaderInput" class="hidden" accept=".json" onchange="readBackupFile(event)">
            </div>
        </div>
        <div class="tabs-container">
            <button class="menu-btn active" id="btn-tab-registro" onclick="switchTab('registro')">📝 Registrar</button>
            <button class="menu-btn" id="btn-tab-lista" onclick="switchTab('lista')">📋 Control</button>
        </div>
    </nav>
    <main>
        <section id="panel-registro" class="tab-panel">
            <div class="panel-header"><h1 id="registro-titulo">Registrar Boleto</h1></div>
            <form id="ticketForm" onsubmit="saveTicket(event)">
                <div class="grid-form">
                    <div class="field-group"><label>Número Boleto:</label><input type="number" id="ticketNumber" class="input-mediano" required min="0"></div>
                    <div class="field-group"><label>Comprador:</label><input type="text" id="buyerName" class="input-mediano" required></div>
                    <div class="field-group"><label>Teléfono:</label><input type="tel" id="buyerPhone" class="input-mediano" required></div>
                    <div class="field-group"><label>Precio ($):</label><input type="number" id="ticketPrice" class="input-mediano" required min="0" step="0.01"></div>
                    <div class="field-group"><label>Estado:</label>
                        <select id="ticketStatus" class="input-mediano">
                            <option value="Vendido">Vendido (Pagado)</option>
                            <option value="Apartado">Apartado (Pendiente)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn-submit-main">💾 Guardar Registro</button>
            </form>
        </section>
        <section id="panel-lista" class="tab-panel hidden">
            <div class="panel-header"><h1 id="lista-titulo">Control General y Ventas</h1></div>
            <div class="grid-stats">
                <div class="stat-card"><h3>Vendidos</h3><div id="stat-sold" class="stat-number color-vendidos">0</div></div>
                <div class="stat-card"><h3>Apartados</h3><div id="stat-reserved" class="stat-number color-apartados">0</div></div>
                <div class="stat-card"><h3>Recaudado ($)</h3><div id="stat-money" class="stat-number color-recaudado">0.00</div></div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Nº</th><th>Comprador</th><th>Teléfono</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr></thead>
                    <tbody id="ticketsTableBody"></tbody>
                </table>
            </div>
            <div id="emptyTableMessage" class="msg-box hidden" style="color:#6B7280;">Ningún boleto registrado aún.</div>
        </section>
    </main>
    <script>
        let database = {}, currentRaffle = "";
        window.addEventListener('DOMContentLoaded', () => { loadFromLocalStorage(); renderRaffleSelect(); if (currentRaffle) { loadSelectedRaffle(); } else { toggleInputsLayout(false); } });
        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('rifas_pro_db'), savedCurrent = localStorage.getItem('rifas_pro_current');
            if (savedData) { try { database = JSON.parse(savedData); } catch (e) { database = {}; } }
            if (savedCurrent && database[savedCurrent]) { currentRaffle = savedCurrent; } else { const keys = Object.keys(database); currentRaffle = keys.length > 0 ? keys[0] : ""; }
        }
        function saveToLocalStorage() { localStorage.setItem('rifas_pro_db', JSON.stringify(database)); localStorage.setItem('rifas_pro_current', currentRaffle); showSyncIndicator(); }
function showSyncIndicator() { const dot = document.getElementById('syncIndicatorDot'), text = document.getElementById('syncIndicatorText'); dot.className = "dot dot-amber"; text.innerText = "Guardando..."; setTimeout(() => { dot.className = "dot dot-green"; text.innerText = "Local Activo"; }, 600); }
function renderRaffleSelect() {
const select = document.getElementById('raffleSelect'); select.innerHTML = ""; const keys = Object.keys(database);
if (keys.length === 0) { const opt = document.createElement('option'); opt.value = ""; opt.innerText = "--- Sin rifas ---"; select.appendChild(opt); document.getElementById('deleteRaffleBtn').disabled = true; return; }
keys.forEach(key => { const opt = document.createElement('option'); opt.value = key; opt.innerText = key.toUpperCase(); if (key === currentRaffle) opt.selected = true; select.appendChild(opt); });
document.getElementById('deleteRaffleBtn').disabled = false;
}
function loadSelectedRaffle() { const select = document.getElementById('raffleSelect'); if (select.value === "") { currentRaffle = ""; toggleInputsLayout(false); return; } currentRaffle = select.value; saveToLocalStorage(); toggleInputsLayout(true); updateViewData(); }
function toggleInputsLayout(hasRaffle) {
document.getElementById('submitBtn').disabled = !hasRaffle; const rTit = document.getElementById('registro-titulo'), lTit = document.getElementById('lista-titulo');
if (hasRaffle) { rTit.innerText = "Registrar Boleto - Rifa: " + currentRaffle.toUpperCase(); lTit.innerText = "Control General - Rifa: " + currentRaffle.toUpperCase(); } else { rTit.innerText = "Crea una rifa primero arriba"; lTit.innerText = "Crea una rifa primero arriba"; clearStatsAndTable(); }
}
function ejecutarCreacionDeRifa(event) {
event.preventDefault(); const input = document.getElementById('newRaffleNameInput'), name = input.value.trim();
if (!name) { alert("Ingresa un nombre válido."); return; } if (database[name]) { alert("Ya existe esa rifa."); return; }
database[name] = {}; currentRaffle = name; input.value = ""; saveToLocalStorage(); renderRaffleSelect(); loadSelectedRaffle();
}
function cleanUpRaffle(event) {
event.preventDefault(); if (!currentRaffle) return;
if (confirm("¿Eliminar la rifa " + currentRaffle.toUpperCase() + "?")) { delete database[currentRaffle]; const keys = Object.keys(database); currentRaffle = keys.length > 0 ? keys[0] : ""; saveToLocalStorage(); renderRaffleSelect(); loadSelectedRaffle(); }
}
function saveTicket(event) {
event.preventDefault(); if (!currentRaffle) return;
const num = document.getElementById('ticketNumber').value.trim(), name = document.getElementById('buyerName').value.trim(), phone = document.getElementById('buyerPhone').value.trim(), price = parseFloat(document.getElementById('ticketPrice').value) || 0, status = document.getElementById('ticketStatus').value;
if (database[currentRaffle][num] && !confirm("Boleto Nº " + num + " ya existe. ¿Sobreescribir?")) return;
database[currentRaffle][num] = { name, phone, price, status }; saveToLocalStorage(); updateViewData(); document.getElementById('ticketForm').reset(); alert("¡Guardado!");
}
function deleteTicket(num) { if (confirm("¿Eliminar boleto Nº " + num + "?")) { delete database[currentRaffle][num]; saveToLocalStorage(); updateViewData(); } }
function updateViewData() {
if (!currentRaffle) { clearStatsAndTable(); return; }
const tickets = database[currentRaffle], tbody = document.getElementById('ticketsTableBody'); tbody.innerHTML = "";
let sold = 0, res = 0, money = 0; const sorted = Object.keys(tickets).sort((a, b) => parseInt(a) - parseInt(b));
if (sorted.length === 0) { document.getElementById('emptyTableMessage').classList.remove('hidden'); } else { document.getElementById('emptyTableMessage').classList.add('hidden'); }
sorted.forEach(num => {
const t = tickets[num]; if (t.status === "Vendido") { sold++; money += t.price; } else { res++; }
const tr = document.createElement('tr'), bClass = t.status === "Vendido" ? "badge-v" : "badge-a";
tr.innerHTML = ""+num+""+escapeHTML(t.name)+""+escapeHTML(t.phone)+"$"+t.price.toFixed(2)+""+t.status+"🗑️ Borrar";
tbody.appendChild(tr);
});
document.getElementById('stat-sold').innerText = sold; document.getElementById('stat-reserved').innerText = res; document.getElementById('stat-money').innerText = money.toFixed(2);
}
function clearStatsAndTable() { document.getElementById('stat-sold').innerText = "0"; document.getElementById('stat-reserved').innerText = "0"; document.getElementById('stat-money').innerText = "0.00"; document.getElementById('ticketsTableBody').innerHTML = ""; document.getElementById('emptyTableMessage').classList.remove('hidden'); }
function downloadBackupFile() {
const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(database, null, 2)), dl = document.createElement('a'), f = new Date().toISOString().slice(0,10);
dl.setAttribute("href", dataStr); dl.setAttribute("download", "respaldo_rifas_" + f + ".json"); document.body.appendChild(dl); dl.click(); dl.remove();
}
function readBackupFile(event) {
const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
reader.onload = function(e) {
try {
const imported = JSON.parse(e.target.result);
if (typeof imported === 'object' && imported !== null && !Array.isArray(imported)) {
if (confirm("¿Fusionar respaldos?")) { database = { ...database, ...imported }; const keys = Object.keys(database); if (keys.length > 0) currentRaffle = keys[0]; saveToLocalStorage(); renderRaffleSelect(); loadSelectedRaffle(); alert("¡Restaurado!"); }
} else { alert("Formato inválido."); }
} catch (err) { alert("Error al leer archivo."); }
};
reader.readAsText(file); event.target.value = "";
}
function switchTab(tabName) {
const btnR = document.getElementById('btn-tab-registro'), btnL = document.getElementById('btn-tab-lista'), pR = document.getElementById('panel-registro'), pL = document.getElementById('panel-lista');
if (tabName === 'registro') { btnR.classList.add('active'); btnL.classList.remove('active'); pR.classList.remove('hidden'); pL.classList.add('hidden'); } else { btnR.classList.remove('active'); btnL.classList.add('active'); pR.classList.add('hidden'); pL.classList.remove('hidden'); updateViewData(); }
}
function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&', '<': '<', '>': '>', "'": ''', '"': '"' }[tag] || tag)); }
