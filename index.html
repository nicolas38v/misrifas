<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Administración de Rifas Pro - Nube Gratis</title>
    
    <style>
        :root {
            --azul-corporativo: #1E40AF;
            --azul-oscuro: #172554;
            --verde-suave: #DCFCE7;
            --verde-fuerte: #047857;
            --beige-fondo: #F5F5DC;
            --gris-borde: #D1D5DB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--beige-fondo);
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background-color: var(--azul-corporativo);
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border-bottom: 4px solid var(--azul-oscuro);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-container {
            max-width: 95%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 1200px) {
            .nav-container {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .management-box {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            background-color: rgba(23, 37, 84, 0.4);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #60A5FA;
        }

        .nav-title {
            color: #FFFFFF;
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 0.05em;
        }

        select, .input-top {
            padding: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 6px;
            border: 2px solid #FFFFFF;
            min-width: 250px;
            color: #000000;
            background-color: #FFFFFF;
        }

        .btn-action {
            padding: 10px 18px;
            font-weight: 900;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #FFFFFF;
        }

        .btn-create { background-color: #10B981; }
        .btn-delete { background-color: #EF4444; }
        .btn-delete:disabled { background-color: #FCA5A5; cursor: not-allowed; }
        
        .btn-backup-download { background-color: #059669; font-size: 0.85rem; padding: 8px 12px; }
        .btn-backup-upload { background-color: #4B5563; font-size: 0.85rem; padding: 8px 12px; }

        .sync-box {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: #111827;
            padding: 8px 15px;
            border-radius: 8px;
            color: #FFF;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-green { background: #10B981; }
        .dot-amber { background: #F59E0B; }

        .tabs-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
        }

        .menu-btn {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #FFFFFF;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .menu-btn.active {
            background-color: #FFFFFF;
            color: var(--azul-corporativo);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        main {
            flex-grow: 1;
            padding: 20px;
            max-width: 95%;
            width: 100%;
            margin: 0 auto;
        }

        .tab-panel {
            width: 100%;
            background-color: #FFFFFF;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
        }

        .hidden { display: none !important; }

        .panel-header {
            border-bottom: 4px solid var(--azul-corporativo);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .panel-header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--azul-corporativo);
        }

        .grid-form {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 850px;
            margin-bottom: 25px;
        }

        @media (min-width: 768px) {
            .grid-form { grid-template-columns: 1fr 1fr; }
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label { font-size: 1rem; font-weight: 900; }

        .input-mediano {
            width: 100%;
            max-width: 360px;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            border: 3px solid var(--azul-corporativo);
            border-radius: 10px;
        }

        .btn-submit-main {
            background-color: #059669;
            color: #FFFFFF;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            align-self: flex-start;
        }

        .btn-submit-main:disabled { background-color: #A7F3D0; cursor: not-allowed; }

        .table-wrapper { overflow-x: auto; background-color: #FFFFFF; border: 1px solid var(--gris-borde); border-radius: 12px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: var(--verde-fuerte); color: #FFFFFF; padding: 12px; font-weight: 700; }
        td { padding: 12px; border-bottom: 1px solid var(--gris-borde); font-weight: 600; }

        .grid-stats { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }
        @media (min-width: 640px) { .grid-stats { grid-template-columns: repeat(3, 1fr); } }
        .stat-card { background-color: #FFFFFF; padding: 20px; border-radius: 12px; border: 2px solid var(--gris-borde); text-align: center; }
        .stat-number { font-size: 2.2rem; font-weight: 900; margin-top: 8px; }
        .color-vendidos { color: var(--verde-fuerte); }
        .color-apartados { color: #D97706; }
        .color-recaudado { color: var(--azul-corporativo); }
        .msg-box { padding: 10px; font-size: 1.1rem; font-weight: 800; text-align: center; }
        
        .badge-v { background-color: var(--verde-suave); color: var(--verde-fuerte); padding: 4px 8px; border-radius: 6px; }
        .badge-a { background-color: #FEF3C7; color: #D97706; padding: 4px 8px; border-radius: 6px; }
    </style>
</head>
<body>

    <!-- MENÚ SUPERIOR -->
    <nav>
        <div class="nav-container">
            <div class="management-box">
                <span class="nav-title">🎟️ GESTIÓN DE RIFA:</span>
                <select id="raffleSelect" onchange="loadSelectedRaffle()">
                    <!-- Se llena dinámicamente -->
                </select>
                <input type="text" id="newRaffleNameInput" class="input-top" style="min-width:180px;" placeholder="Nombre de nueva rifa...">
                <button type="button" onclick="ejecutarCreacionDeRifa(event)" class="btn-action btn-create">➕ CREAR</button>
                <button id="deleteRaffleBtn" type="button" onclick="cleanUpRaffle(event)" class="btn-action btn-delete" disabled>❌ ELIMINAR</button>
            </div>

            <div class="sync-box">
                <div id="syncIndicatorDot" class="dot dot-green"></div>
                <span id="syncIndicatorText">Almacenamiento Local Activo</span>
                <button type="button" onclick="downloadBackupFile()" class="btn-action btn-backup-download" title="Guardar archivo en tu PC o Celular">💾 Descargar Archivo</button>
                <button type="button" onclick="document.getElementById('fileLoaderInput').click()" class="btn-action btn-backup-upload" title="Cargar un archivo guardado previamente">📂 Abrir Archivo</button>
                <input type="file" id="fileLoaderInput" class="hidden" accept=".json" onchange="readBackupFile(event)">
            </div>
        </div>
        
        <div class="tabs-container">
            <button class="menu-btn active" id="btn-tab-registro" onclick="switchTab('registro')">📝 Registrar Boleto</button>
            <button class="menu-btn" id="btn-tab-lista" onclick="switchTab('lista')">📋 Lista de Boletos</button>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <!-- PANEL DE REGISTRO -->
        <section id="panel-registro" class="tab-panel">
            <div class="panel-header">
                <h1 id="registro-titulo">Registrar Boleto</h1>
            </div>
            
            <form id="ticketForm" onsubmit="saveTicket(event)">
                <div class="grid-form">
                    <div class="field-group">
                        <label for="ticketNumber">Número de Boleto:</label>
                        <input type="number" id="ticketNumber" class="input-mediano" required min="0" placeholder="Ej: 14">
                    </div>
                    <div class="field-group">
