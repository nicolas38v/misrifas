<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Rifas Pro</title>
    <style>
        :root { --azul: #1E40AF; --oscuro: #172554; --verde-s: #DCFCE7; --verde-f: #047857; --beige: #F5F5DC; --borde: #D1D5DB; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--beige); color: #000; min-height: 100vh; display: flex; flex-direction: column; }
        nav { background-color: var(--azul); padding: 15px; border-bottom: 4px solid var(--oscuro); position: sticky; top: 0; z-index: 50; }
        .nav-container { max-width: 95%; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        @media (min-width: 1200px) { .nav-container { flex-direction: row; justify-content: space-between; align-items: center; } }
        .management-box { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background-color: rgba(23,37,84,0.4); padding: 12px; border-radius: 10px; border: 1px solid #60A5FA; }
        .nav-title { color: #FFF; font-weight: 900; font-size: 1.1rem; }
        select, .input-top { padding: 8px; font-size: 1rem; font-weight: 800; border-radius: 6px; border: 2px solid #FFF; min-width: 200px; }
        .btn-action { padding: 8px 14px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; color: #FFF; }
        .btn-create { background-color: #10B981; }
        .btn-delete { background-color: #EF4444; }
        .btn-delete:disabled { background-color: #FCA5A5; cursor: not-allowed; }
        .btn-backup-download { background-color: #059669; font-size: 0.85rem; }
        .btn-backup-upload { background-color: #4B5563; font-size: 0.85rem; }
        .sync-box { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; background: #111827; padding: 8px 15px; border-radius: 8px; color: #FFF; font-size: 0.85rem; }
        .tabs-container { display: flex; gap: 8px; justify-content: center; margin-top: 15px; }
        .menu-btn { padding: 10px 20px; font-size: 1rem; font-weight: 900; text-transform: uppercase; color: #FFF; background: rgba(255,255,255,0.2); border: none; border-radius: 8px; cursor: pointer; }
        .menu-btn.active { background-color: #FFF; color: var(--azul); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        main { flex-grow: 1; padding: 20px; max-width: 95%; width: 100%; margin: 0 auto; }
        .tab-panel { width: 100%; background-color: #FFF; border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        .panel-header { border-bottom: 4px solid var(--azul); padding-bottom: 12px; margin-bottom: 20px; }
        .panel-header h1 { font-size: 1.6rem; font-weight: 900; color: var(--azul); }
        .grid-form { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 850px; margin-bottom: 25px; }
        @media (min-width: 768px) { .grid-form { grid-template-columns: 1fr 1fr; } }
        .field-group { display: flex; flex-direction: column; gap: 6px; }
        .field-group label { font-size: 1rem; font-weight: 900; }
        .input-mediano { width: 100%; max-width: 360px; padding: 10px; font-size: 1rem; font-weight: 700; border: 3px solid var(--azul); border-radius: 10px; }
        .btn-submit-main { background-color: #059669; color: #FFF; font-weight: 900; font-size: 1.1rem; padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; align-self: flex-start; }
        .table-wrapper { overflow-x: auto; background-color: #FFF; border: 1px solid var(--borde); border-radius: 12px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: var(--verde-f); color: #FFF; padding: 12px; font-weight: 700; }
        td { padding: 12px; border-bottom: 1px solid var(--borde); font-weight: 600; }
        .grid-stats { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }
        @media (min-width: 640px) { .grid-stats { grid-template-columns: repeat(3, 1fr); } }
        .stat-card { background-color: #FFF; padding: 15px; border-radius: 12px; border: 2px solid var(--borde); text-align: center; }
        .stat-number { font-size: 2rem; font-weight: 900; margin-top: 8px; }
        .color-vendidos { color: var(--verde-f); }
        .color-apartados { color: #D97706; }
        .color-recaudado { color: var(--azul); }
        .msg-box { padding: 10px; font-size: 1.1rem; font-weight: 800; text-align: center; }
        .badge-v { background-color: var(--verde-s); color: var(--verde-f); padding: 4px 8px; border-radius: 6px; }
        .badge-a { background-color: #FEF3C7; color: #D97706; padding: 4px 8px; border-radius: 6px; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="management-box">
                <span class="nav-title">🎟️ GESTIÓN:</span>
                <select id="raffleSelect"></select>
                <input type="text" id="newRaffleNameInput" class="input-top" placeholder="Nueva rifa...">
                <button type="button" id="btnCrear" class="btn-action btn-create">➕ CREAR</button>
                <button type="button" id="deleteRaffleBtn" class="btn-action btn-delete" disabled>❌ ELIMINAR</button>
            </div>
            <div class="sync-box">
                <button type="button" id="btnDescargar" class="btn-action btn-backup-download">💾 Descargar Backup</button>
                <button type="button" id="btnAbrir" class="btn-action btn-backup-upload">📂 Abrir Backup</button>
                <input type="file" id="fileLoaderInput" class="hidden" accept=".json">
            </div>
        </div>
        <div class="tabs-container">
            <button type="button" class="menu-btn active" id="btn-tab-registro">📝 Registrar</button>
            <button type="button" class="menu-btn" id="btn-tab-lista">📋 Control</button>
        </div>
    </nav>
    <main>
        <section id="panel-registro" class="tab-panel">
            <div class="panel-header"><h1 id="registro-titulo">Registrar Boleto</h1></div>
            <form id="ticketForm">
                <div class="grid-form">
                    <div class="field-group"><label>Número Boleto:</label><input type="number" id="ticketNumber" class="input-mediano" required min="0"></div>
                    <div class="field-group"><label>Comprador:</label><input type="text" id="buyerName" class="input-mediano" required></div>
                    <div class="field-group"><label>Teléfono:</label><input type="tel" id="buyerPhone" class="input-mediano" required></div>
                    <div class="field-group"><label>Precio ($):</label><input type="number" id="ticketPrice" class="input-mediano" required min="0" step="0.01"></div>
                    <div class="field-group"><label>Estado:</label>
                        <select id="ticketStatus" class="input-mediano">
                            <option value="Vendido">Vendido (Pagado)</option>
                            <option value="Apartado">Apartado (Pendiente)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn-submit-main">💾 Guardar Registro</button>
            </form>
        </section>
        <section id="panel-lista" class="tab-panel hidden">
            <div class="panel-header"><h1 id="lista-titulo">Control de Boletos</h1></div>
            <div class="table-wrapper">
                <!-- Se poblará dinámicamente -->
            </div>
        </section>
    </main>

    <script>
        // === MOTOR DE DATOS EN MEMORIA AUTÓNOMO ===
        let appData = {
            activeRaffleId: "r_base",
            raffles: { "r_base": { name: "Rifa Principal", tickets: {} } }
        };

        // --- ASIGNACIÓN DE ENLACES NATIVOS ---
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("btnCrear").onclick = ejecutarCreacionDeRifa;
            document.getElementById("deleteRaffleBtn").onclick = cleanUpRaffle;
            document.getElementById("ticketForm").onsubmit = saveTicket;
            document.getElementById("btnDescargar").onclick = downloadBackupFile;
            document.getElementById("btnAbrir").onclick = () => document.getElementById("fileLoaderInput").click();
            document.getElementById("fileLoaderInput").onchange = readBackupFile;
            
            document.getElementById("raffleSelect").onchange = (e) => {
                appData.activeRaffleId = e.target.value;
                loadSelectedRaffle();
            };
            
            document.getElementById("btn-tab-registro").onclick = () => switchTab('registro');
            document.getElementById("btn-tab-lista").onclick = () => switchTab('lista');

            refrescarTodaLaUI();
        });

        function refrescarTodaLaUI() {
            updateRaffleSelectOptions();
            loadSelectedRaffle();
        }

        // --- ENRUTADOR DE PESTAÑAS (TABS) ---
        function switchTab(tabId) {
            document.getElementById('panel-registro').classList.toggle('hidden', tabId !== 'registro');
            document.getElementById('panel-lista').classList.toggle('hidden', tabId !== 'lista');
            document.getElementById('btn-tab-registro').classList.toggle('active', tabId === 'registro');
            document.getElementById('btn-tab-lista').classList.toggle('active', tabId === 'lista');

            if (tabId === 'lista') {
                renderTicketTable();
            }
        }

        // --- GESTIÓN DE RIFAS NATIVAS ---
        function updateRaffleSelectOptions() {
            const select = document.getElementById('raffleSelect');
            if (!select) return;
            select.innerHTML = "";
            
            Object.keys(appData.raffles).forEach(id => {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = appData.raffles[id].name;
                if (id === appData.activeRaffleId) opt.selected = true;
                select.appendChild(opt);
            });

            document.getElementById('deleteRaffleBtn').disabled = Object.keys(appData.raffles).length <= 1;
        }
        function loadSelectedRaffle() {
            const select = document.getElementById('raffleSelect');
            if (select && select.value && appData.raffles[select.value]) {
                appData.activeRaffleId = select.value;
                const raffleName = appData.raffles[appData.activeRaffleId].name;
                
                document.getElementById('registro-titulo').textContent = `Registrar Boleto - ${raffleName}`;
                document.getElementById('lista-titulo').textContent = `Control de Boletos - ${raffleName}`;
                
                if (!document.getElementById('panel-lista').classList.contains('hidden')) {
                    renderTicketTable();
                }
            }
        }

        function ejecutarCreacionDeRifa() {
            const input = document.getElementById('newRaffleNameInput');
            const name = input.value.trim();
            
            if (!name) {
                alert("Por favor, introduce un nombre válido para la rifa.");
                return;
            }

            const newId = "r_" + Date.now();
            appData.raffles[newId] = { name: name, tickets: {} };
            appData.activeRaffleId = newId;
            
            input.value = "";
            refrescarTodaLaUI();
        }

        function cleanUpRaffle() {
            if (Object.keys(appData.raffles).length <= 1) return;
            const currentName = appData.raffles[appData.activeRaffleId].name;
            
            if (confirm(`¿Estás seguro de eliminar la rifa "${currentName}" de la sesión actual?`)) {
                delete appData.raffles[appData.activeRaffleId];
                appData.activeRaffleId = Object.keys(appData.raffles);
                refrescarTodaLaUI();
            }
        }

        // --- MANEJO DE BOLETOS ---
        function saveTicket(event) {
            event.preventDefault();
            const active = appData.raffles[appData.activeRaffleId];
            if (!active) return;

            const number = document.getElementById('ticketNumber').value.trim();
            const buyer = document.getElementById('buyerName').value.trim();
            const phone = document.getElementById('buyerPhone').value.trim();
            const price = parseFloat(document.getElementById('ticketPrice').value) || 0;
            const status = document.getElementById('ticketStatus').value;

            if (!active.tickets) active.tickets = {};

            if (active.tickets[number]) {
                const overwrite = confirm(`El boleto N° ${number} ya existe a nombre de ${active.tickets[number].buyer}. ¿Deseas sobreescribirlo?`);
                if (!overwrite) return;
            }

            active.tickets[number] = { buyer, phone, price, status };
            
            document.getElementById('ticketForm').reset();
            refrescarTodaLaUI();
            alert(`Boleto N° ${number} guardado en la memoria de la interfaz.`);
        }

        function deleteTicket(num) {
            if (confirm(`¿Eliminar el boleto N° ${num}?`)) {
                delete appData.raffles[appData.activeRaffleId].tickets[num];
                renderTicketTable();
            }
        }

        // --- PANEL DE CONTROL (TABLAS Y ESTADÍSTICAS) ---
        function renderTicketTable() {
            const panelLista = document.getElementById('panel-lista');
            let statsContainer = document.getElementById('statsGridContainer');
            
            if (!statsContainer) {
                statsContainer = document.createElement('div');
                statsContainer.id = 'statsGridContainer';
                statsContainer.className = 'grid-stats';
                panelLista.insertBefore(statsContainer, panelLista.querySelector('.table-wrapper'));
            }

            const tableWrapper = panelLista.querySelector('.table-wrapper');
            tableWrapper.innerHTML = `<table><thead><tr><th>N° Boleto</th><th>Comprador</th><th>Teléfono</th><th>Precio</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="ticketTableBody"></tbody></table>`;
            
            const tbody = document.getElementById('ticketTableBody');
            const active = appData.raffles[appData.activeRaffleId];
            const tickets = active && active.tickets ? active.tickets : {};
            const keys = Object.keys(tickets).sort((a,b) => parseInt(a) - parseInt(b));

            let vendidos = 0, apartados = 0, total = 0;

            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="msg-box">Esta rifa no contiene registros en memoria todavía.</td></tr>`;
            } else {
                keys.forEach(num => {
                    const t = tickets[num];
                    const isVendido = t.status === 'Vendido';
                    if (isVendido) { vendidos++; total += t.price; } else { apartados++; }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${num}</strong></td><td>${t.buyer}</td><td>${t.phone}</td><td>$${t.price.toFixed(2)}</td>
                        <td><span class="${isVendido ? 'badge-v' : 'badge-a'}">${t.status}</span></td>
                        <td><button type="button" class="btn-action btn-delete" style="padding:4px 8px; font-size:0.8rem;">🗑️</button></td>
                    `;
                    row.querySelector('.btn-delete').onclick = () => deleteTicket(num);
                    tbody.appendChild(row);
                });
            }

            statsContainer.innerHTML = `
                <div class="stat-card"><div>Vendidos (Pagados)</div><div class="stat-number color-vendidos">${vendidos}</div></div>
                <div class="stat-card"><div>Apartados (Pendientes)</div><div class="stat-number color-apartados">${apartados}</div></div>
                <div class="stat-card"><div>Total Recaudado ($)</div><div class="stat-number color-recaudado">$${total.toFixed(2)}</div></div>`;
        }

        // --- SISTEMA TRADICIONAL DE RESPALDOS JSON ---
        function downloadBackupFile() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            const dateStamp = new Date().toISOString().slice(0, 10);
            
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `Backup_RifasPro_${dateStamp}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function readBackupFile(event) {
            const file = event.target.files;
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && parsed.raffles) {
                        appData = parsed;
                        refrescarTodaLaUI();
                        if (!document.getElementById('panel-lista').classList.contains('hidden')) renderTicketTable();
                        alert("¡Archivo de datos cargado con éxito en la aplicación!");
                    } else {
                        alert("El archivo JSON ingresado no cuenta con el formato correcto.");
                    }
                } catch (err) { 
                    alert("Error al leer el archivo de respaldo."); 
                }
                event.target.value = "";
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
