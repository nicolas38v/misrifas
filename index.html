<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Rifas Pro</title>
    <style>
        :root { --azul: #1E40AF; --oscuro: #172554; --verde-s: #DCFCE7; --verde-f: #047857; --beige: #F5F5DC; --borde: #D1D5DB; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--beige); color: #000; min-height: 100vh; display: flex; flex-direction: column; }
        nav { background-color: var(--azul); padding: 15px; border-bottom: 4px solid var(--oscuro); position: sticky; top: 0; z-index: 50; }
        .nav-container { max-width: 95%; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        @media (min-width: 1200px) { .nav-container { flex-direction: row; justify-content: space-between; align-items: center; } }
        .management-box { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background-color: rgba(23,37,84,0.4); padding: 12px; border-radius: 10px; border: 1px solid #60A5FA; }
        .nav-title { color: #FFF; font-weight: 900; font-size: 1.1rem; }
        select, .input-top { padding: 8px; font-size: 1rem; font-weight: 800; border-radius: 6px; border: 2px solid #FFF; min-width: 200px; }
        .btn-action { padding: 8px 14px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; color: #FFF; }
        .btn-create { background-color: #10B981; }
        .btn-delete { background-color: #EF4444; }
        .btn-delete:disabled { background-color: #FCA5A5; cursor: not-allowed; }
        .btn-backup-download { background-color: #059669; font-size: 0.85rem; }
        .btn-backup-upload { background-color: #4B5563; font-size: 0.85rem; }
        .sync-box { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; background: #111827; padding: 8px 15px; border-radius: 8px; color: #FFF; font-size: 0.85rem; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-green { background: #10B981; }
        .dot-amber { background: #F59E0B; }
        .tabs-container { display: flex; gap: 8px; justify-content: center; margin-top: 15px; }
        .menu-btn { padding: 10px 20px; font-size: 1rem; font-weight: 900; text-transform: uppercase; color: #FFF; background: rgba(255,255,255,0.2); border: none; border-radius: 8px; cursor: pointer; }
        .menu-btn.active { background-color: #FFF; color: var(--azul); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        main { flex-grow: 1; padding: 20px; max-width: 95%; width: 100%; margin: 0 auto; }
        .tab-panel { width: 100%; background-color: #FFF; border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        .panel-header { border-bottom: 4px solid var(--azul); padding-bottom: 12px; margin-bottom: 20px; }
        .panel-header h1 { font-size: 1.6rem; font-weight: 900; color: var(--azul); }
        .grid-form { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 850px; margin-bottom: 25px; }
        @media (min-width: 768px) { .grid-form { grid-template-columns: 1fr 1fr; } }
        .field-group { display: flex; flex-direction: column; gap: 6px; }
        .field-group label { font-size: 1rem; font-weight: 900; }
        .input-mediano { width: 100%; max-width: 360px; padding: 10px; font-size: 1rem; font-weight: 700; border: 3px solid var(--azul); border-radius: 10px; }
        .btn-submit-main { background-color: #059669; color: #FFF; font-weight: 900; font-size: 1.1rem; padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; align-self: flex-start; }
        .btn-submit-main:disabled { background-color: #A7F3D0; cursor: not-allowed; }
        .table-wrapper { overflow-x: auto; background-color: #FFF; border: 1px solid var(--borde); border-radius: 12px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: var(--verde-f); color: #FFF; padding: 12px; font-weight: 700; }
        td { padding: 12px; border-bottom: 1px solid var(--borde); font-weight: 600; }
        .grid-stats { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }
        @media (min-width: 640px) { .grid-stats { grid-template-columns: repeat(3, 1fr); } }
        .stat-card { background-color: #FFF; padding: 15px; border-radius: 12px; border: 2px solid var(--borde); text-align: center; }
        .stat-number { font-size: 2rem; font-weight: 900; margin-top: 8px; }
        .color-vendidos { color: var(--verde-f); }
        .color-apartados { color: #D97706; }
        .color-recaudado { color: var(--azul); }
        .msg-box { padding: 10px; font-size: 1.1rem; font-weight: 800; text-align: center; }
        .badge-v { background-color: var(--verde-s); color: var(--verde-f); padding: 4px 8px; border-radius: 6px; }
        .badge-a { background-color: #FEF3C7; color: #D97706; padding: 4px 8px; border-radius: 6px; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="management-box">
                <span class="nav-title">🎟️ GESTIÓN:</span>
                <select id="raffleSelect" onchange="loadSelectedRaffle()"></select>
                <input type="text" id="newRaffleNameInput" class="input-top" placeholder="Nueva rifa...">
                <button type="button" onclick="ejecutarCreacionDeRifa()" class="btn-action btn-create">➕ CREAR</button>
                <button id="deleteRaffleBtn" type="button" onclick="cleanUpRaffle()" class="btn-action btn-delete" disabled>❌ ELIMINAR</button>
            </div>
            <div class="sync-box">
                <div id="syncIndicatorDot" class="dot dot-green"></div>
                <span id="syncIndicatorText">Local Activo</span>
                <button type="button" onclick="downloadBackupFile()" class="btn-action btn-backup-download">💾 Descargar</button>
                <button type="button" onclick="document.getElementById('fileLoaderInput').click()" class="btn-action btn-backup-upload">📂 Abrir</button>
                <input type="file" id="fileLoaderInput" class="hidden" accept=".json" onchange="readBackupFile(event)">
            </div>
        </div>
        <div class="tabs-container">
            <button class="menu-btn active" id="btn-tab-registro" onclick="switchTab('registro')">📝 Registrar</button>
            <button class="menu-btn" id="btn-tab-lista" onclick="switchTab('lista')">📋 Control</button>
        </div>
    </nav>
    <main>
        <section id="panel-registro" class="tab-panel">
            <div class="panel-header"><h1 id="registro-titulo">Registrar Boleto</h1></div>
            <form id="ticketForm" onsubmit="saveTicket(event)">
                <div class="grid-form">
                    <div class="field-group"><label>Número Boleto:</label><input type="number" id="ticketNumber" class="input-mediano" required min="0"></div>
                    <div class="field-group"><label>Comprador:</label><input type="text" id="buyerName" class="input-mediano" required></div>
                    <div class="field-group"><label>Teléfono:</label><input type="tel" id="buyerPhone" class="input-mediano" required></div>
                    <div class="field-group"><label>Precio ($):</label><input type="number" id="ticketPrice" class="input-mediano" required min="0" step="0.01"></div>
                    <div class="field-group"><label>Estado:</label>
                        <select id="ticketStatus" class="input-mediano">
                            <option value="Vendido">Vendido (Pagado)</option>
                            <option value="Apartado">Apartado (Pendiente)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn-submit-main">💾 Guardar Registro</button>
            </form>
        </section>
        <section id="panel-lista" class="tab-panel hidden">
            <div class="panel-header"><h1 id="lista-titulo">Control de Boletos</h1></div>
            <div class="table-wrapper">
                <!-- Se poblará dinámicamente desde JS junto con las estadísticas -->
            </div>
        </section>
    </main>

    <script>
        // --- ESTADO GLOBAL DE LA APLICACIÓN ---
        let appData = {
            activeRaffleId: null,
            raffles: {}
        };

        // --- ENRUTADOR DE PESTAÑAS (TABS) ---
        function switchTab(tabId) {
            document.getElementById('panel-registro').classList.add('hidden');
            document.getElementById('panel-lista').classList.add('hidden');
            document.getElementById('btn-tab-registro').classList.remove('active');
            document.getElementById('btn-tab-lista').classList.remove('active');

            if (tabId === 'registro') {
                document.getElementById('panel-registro').classList.remove('hidden');
                document.getElementById('btn-tab-registro').classList.add('active');
            } else if (tabId === 'lista') {
                document.getElementById('panel-lista').classList.remove('hidden');
                document.getElementById('btn-tab-lista').classList.add('active');
                renderTicketTable();
            }
        }

        // --- PERSISTENCIA E INICIALIZACIÓN ---
        window.addEventListener('DOMContentLoaded', () => {
            const localData = localStorage.getItem('rifas_pro_data');
            if (localData) {
                try {
                    appData = JSON.parse(localData);
                } catch (e) {
                    console.error("Error al leer localStorage, reiniciando datos.", e);
                }
            }
            
            if (!appData.raffles || Object.keys(appData.raffles).length === 0) {
