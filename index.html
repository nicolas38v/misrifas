<script>
    // --- ESTADO GLOBAL DE LA APLICACIÓN ---
    let appData = {
        activeRaffleId: null,
        raffles: {} // Estructura: { id: { name: "", tickets: { number: { buyer, phone, price, status } } } }
    };

    // --- ENRUTADOR DE PESTAÑAS (TABS) ---
    function switchTab(tabId) {
        document.getElementById('panel-registro').classList.add('hidden');
        document.getElementById('panel-lista').classList.add('hidden');
        document.getElementById('btn-tab-registro').classList.remove('active');
        document.getElementById('btn-tab-lista').classList.remove('active');

        if (tabId === 'registro') {
            document.getElementById('panel-registro').classList.remove('hidden');
            document.getElementById('btn-tab-registro').classList.add('active');
        } else if (tabId === 'lista') {
            document.getElementById('panel-lista').classList.remove('hidden');
            document.getElementById('btn-tab-lista').classList.add('active');
            renderTicketTable();
        }
    }

    // --- PERSISTENCIA Y INICIALIZACIÓN ---
    window.addEventListener('DOMContentLoaded', () => {
        const localData = localStorage.getItem('rifas_pro_data');
        if (localData) {
            try {
                appData = JSON.parse(localData);
            } catch (e) {
                console.error("Error al leer localStorage, reiniciando datos.", e);
            }
        }
        
        // Crear una rifa inicial si el almacenamiento está completamente vacío
        if (!appData.raffles || Object.keys(appData.raffles).length === 0) {
            const initialId = "rifa_" + Date.now();
            appData.raffles = {};
            appData.raffles[initialId] = { name: "Rifa Inicial", tickets: {} };
            appData.activeRaffleId = initialId;
        }
        
        saveDataToLocalStorage();
        updateRaffleSelectOptions();
        loadSelectedRaffle();
    });

    function saveDataToLocalStorage() {
        localStorage.setItem('rifas_pro_data', JSON.stringify(appData));
        showSyncIndicator(true);
    }

    function showSyncIndicator(isSynced) {
        const dot = document.getElementById('syncIndicatorDot');
        const text = document.getElementById('syncIndicatorText');
        if (isSynced) {
            dot.className = "dot dot-green";
            text.textContent = "Guardado Local";
        } else {
            dot.className = "dot dot-amber";
            text.textContent = "Pendiente...";
        }
    }

    // --- GESTIÓN DE RIFAS (CREAR, SELECCIONAR, ELIMINAR) ---
    function updateRaffleSelectOptions() {
        const select = document.getElementById('raffleSelect');
        select.innerHTML = "";
        
        Object.keys(appData.raffles).forEach(id => {
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = appData.raffles[id].name;
            if (id === appData.activeRaffleId) opt.selected = true;
            select.appendChild(opt);
        });

        // Activar o desactivar botón de eliminar si hay más de una rifa
        const deleteBtn = document.getElementById('deleteRaffleBtn');
        deleteBtn.disabled = Object.keys(appData.raffles).length <= 1;
    }

    function loadSelectedRaffle() {
        const select = document.getElementById('raffleSelect');
        if (select.value) {
            appData.activeRaffleId = select.value;
            saveDataToLocalStorage();
            
            // Actualizar títulos dinámicos de los paneles
            const raffleName = appData.raffles[appData.activeRaffleId].name;
            document.getElementById('registro-titulo').textContent = `Registrar Boleto - ${raffleName}`;
            document.getElementById('lista-titulo').textContent = `Control de Boletos - ${raffleName}`;
            
            // Limpiar formulario de registro por comodidad
            document.getElementById('ticketForm').reset();
            
            // Si la vista actual es la lista, refrescarla de inmediato
            if (!document.getElementById('panel-lista').classList.contains('hidden')) {
                renderTicketTable();
            }
        }
    }

    function ejecutarCreacionDeRifa(event) {
        event.preventDefault();
        const input = document.getElementById('newRaffleNameInput');
        const name = input.value.trim();
        
        if (!name) {
            alert("Por favor, introduce un nombre válido para la nueva rifa.");
            return;
        }

        const newId = "rifa_" + Date.now();
        appData.raffles[newId] = { name: name, tickets: {} };
        appData.activeRaffleId = newId;
        
        input.value = "";
        saveDataToLocalStorage();
        updateRaffleSelectOptions();
        loadSelectedRaffle();
    }

    function cleanUpRaffle(event) {
        event.preventDefault();
        if (Object.keys(appData.raffles).length <= 1) return;

        const currentName = appData.raffles[appData.activeRaffleId].name;
        const confirmDelete = confirm(`¿Estás completamente seguro de eliminar la rifa "${currentName}"? Esta acción borrará todos sus boletos.`);
        
        if (confirmDelete) {
            delete appData.raffles[appData.activeRaffleId];
            appData.activeRaffleId = Object.keys(appData.raffles)[0];
            
            saveDataToLocalStorage();
            updateRaffleSelectOptions();
            loadSelectedRaffle();
        }
    }

    // --- OPERACIONES DE BOLETOS (GUARDAR Y ELIMINAR) ---
    function saveTicket(event) {
        event.preventDefault();
        if (!appData.activeRaffleId) return;

        const number = document.getElementById('ticketNumber').value.trim();
        const buyer = document.getElementById('buyerName').value.trim();
        const phone = document.getElementById('buyerPhone').value.trim();
        const price = parseFloat(document.getElementById('ticketPrice').value);
        const status = document.getElementById('ticketStatus').value;

        // Validar estructura de datos interna por seguridad
        if (!appData.raffles[appData.activeRaffleId].tickets) {
            appData.raffles[appData.activeRaffleId].tickets = {};
        }

        // Guardar o sobrescribir el boleto
        appData.raffles[appData.activeRaffleId].tickets[number] = {
            buyer: buyer,
            phone: phone,
            price: price,
            status: status
        };

        saveDataToLocalStorage();
        document.getElementById('ticketForm').reset();
        alert(`Boleto N° ${number} guardado con éxito.`);
    }

    function deleteTicket(number) {
        if (!appData.activeRaffleId) return;
        if (confirm(`¿Eliminar el registro del boleto N° ${number}?`)) {
            delete appData.raffles[appData.activeRaffleId].tickets[number];
            saveDataToLocalStorage();
            renderTicketTable();
        }
    }

    // --- PROCESAMIENTO DE ESTADÍSTICAS Y VISTA DE TABLA ---
    function renderTicketTable() {
        const panelLista = document.getElementById('panel-lista');
        if (!panelLista) return;

        // Buscar o inyectar dinámicamente el contenedor de estadísticas para mantener la UI limpia
        let statsContainer = document.getElementById('statsGridContainer');
        if (!statsContainer) {
            statsContainer = document.createElement('div');
            statsContainer.id = 'statsGridContainer';
            statsContainer.className = 'grid-stats';
            panelLista.insertBefore(statsContainer, panelLista.querySelector('.table-wrapper'));
        }

        // Buscar o inyectar dinámicamente el cuerpo de la tabla
        const tableWrapper = panelLista.querySelector('.table-wrapper');
        tableWrapper.innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>N° Boleto</th>
                        <th>Comprador</th>
                        <th>Teléfono</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="ticketTableBody"></tbody>
            </table>
        `;

        const tbody = document.getElementById('ticketTableBody');
        const activeRaffle = appData.raffles[appData.activeRaffleId];
        const tickets = activeRaffle && activeRaffle.tickets ? activeRaffle.tickets : {};
        const sortedNumbers = Object.keys(tickets).sort((a, b) => parseInt(a) - parseInt(b));

        // Inicializadores de estadísticas numéricas
        let countVendidos = 0;
        let countApartados = 0;
        let totalRecaudado = 0;

        if (sortedNumbers.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="msg-box">No hay boletos registrados en esta rifa.</td></tr>`;
        } else {
            sortedNumbers.forEach(num => {
                const t = tickets[num];
                const isVendido = t.status === 'Vendido';
                
                // Procesar acumuladores analíticos
                if (isVendido) {
                    countVendidos++;
                    totalRecaudado += t.price;
                } else {
                    countApartados++;
                }

                // Generar fila con estilos condicionales usando las clases CSS provistas
                const row = document.createElement('tr');
                const badgeClass = isVendido ? 'badge-v' : 'badge-a';
                
                row.innerHTML = `
                    <td><strong>${num}</strong></td>
                    <td>${t.buyer}</td>
                    <td>${t.phone}</td>
                    <td>$${t.price.toFixed(2)}</td>
                    <td><span class="${badgeClass}">${t.status}</span></td>
                    <td>
